[package]
name = "catv-transcoder-client"
version = "0.1.0"
edition = "2021"
authors = ["HjSolutions <eguee23@icloud.com>"]
description = "Cliente de transcodificación distribuido para sistemas CATV"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Eguee/hjStream"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Web framework y HTTP
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1.5"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialización
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging y tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Tiempo y fechas
chrono = { version = "0.4", features = ["serde"] }

# Manejo de errores
anyhow = "1.0"
thiserror = "1.0"

# Networking
bytes = "1.7"

# WebSocket
futures = "0.3"
futures-util = "0.3"

# Configuración
toml = "0.8"
dotenv = "0.15"

# Utilidades
uuid = { version = "1.10", features = ["v4", "serde"] }
regex = "1.11"

# Sistema de archivos
notify = "6.1"  # Para file watching

# Procesos
nix = { version = "0.29", features = ["signal"] }

# Métricas (opcional, para Prometheus)
prometheus = { version = "0.13", optional = true }

# SRT nativo (opcional - requiere libsrt instalado)
# srt-tokio = { version = "0.4", optional = true }

# FFmpeg bindings (opcional - alternativa a usar ffmpeg como proceso)
# ffmpeg-next = { version = "7.0", optional = true }

[dev-dependencies]
# Testing
tokio-test = "0.4"
mockito = "1.5"
tempfile = "3.13"

[features]
default = ["metrics"]
metrics = ["prometheus"]
# srt-native = ["srt-tokio"]
# ffmpeg-native = ["ffmpeg-next"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "catv-transcoder"
path = "src/main.rs"