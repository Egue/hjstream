global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'catv-transcoding'
    environment: 'production'

scrape_configs:
  # Transcoder metrics
  - job_name: 'hjstream'
    static_configs:
      - targets: ['transcoder:9090']
        labels:
          instance: 'transcoder-01'
      
  # Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']