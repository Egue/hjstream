# Docker Compose para desarrollo con hot-reload

version: '3.8'

services:
  transcoder-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: hjstream:dev
    container_name: transcoder-dev
    
    network_mode: host
    
    volumes:
      # Montar código fuente para hot-reload
      - ./src:/app/src:ro
      - ./Cargo.toml:/app/Cargo.toml:ro
      - ./config:/app/config
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      
      # Cache de Cargo
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    
    environment:
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
      - CLIENT_ID=transcoder-dev
    
    command: cargo watch -x run
    
    stdin_open: true
    tty: true

volumes:
  cargo-cache:
  target-cache: