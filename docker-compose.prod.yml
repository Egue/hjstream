# Docker Compose para producción con múltiples transcoders

version: '3.8'

services:
  # ============================================================================
  # Transcoder 1
  # ============================================================================
  transcoder-01:
    build:
      context: .
      dockerfile: Dockerfile
    image: hjstream:latest
    container_name: transcoder-01
    hostname: transcoder-01
    restart: always
    network_mode: host
    
    volumes:
      - ./config-01:/app/config
      - ./logs-01:/app/logs
      - ./env-01:/app/.env:ro
    
    environment:
      - RUST_LOG=info
      - CLIENT_ID=transcoder-01
      - SERVER_PORT=8080
      - METRICS_PORT=9090
    
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 8G
        reservations:
          cpus: '4.0'
          memory: 4G

  # ============================================================================
  # Transcoder 2
  # ============================================================================
  transcoder-02:
    build:
      context: .
      dockerfile: Dockerfile
    image: hjstream:latest
    container_name: transcoder-02
    hostname: transcoder-02
    restart: always
    network_mode: host
    
    volumes:
      - ./config-02:/app/config
      - ./logs-02:/app/logs
      - ./env-02:/app/.env:ro
    
    environment:
      - RUST_LOG=info
      - CLIENT_ID=transcoder-02
      - SERVER_PORT=8081
      - METRICS_PORT=9091
    
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 8G
        reservations:
          cpus: '4.0'
          memory: 4G

  # ============================================================================
  # Prometheus - Agregador de métricas
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    
    ports:
      - "9092:9090"
    
    volumes:
      - ./deploy/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'

  # ============================================================================
  # Grafana - Visualización
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    
    ports:
      - "3000:3000"
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana:/etc/grafana/provisioning
    
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.example.com
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}

volumes:
  prometheus-data:
  grafana-data: