<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaMTX Orchestrator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
    <div x-data="channelManager()" x-init="init()" class="container mx-auto p-6 max-w-7xl">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">📡 MediaMTX Orchestrator</h1>
            <p class="text-gray-600">Gestión de canales RTSP → UDP</p>
        </div>

        <!-- Mensajes de notificación -->
        <div x-show="notification.show" 
             x-transition
             class="fixed top-4 right-4 z-50 p-4 rounded-lg shadow-lg"
             :class="notification.type === 'success' ? 'bg-green-500' : 'bg-red-500'"
             x-text="notification.message"
             @click="notification.show = false"
             style="display: none;">
        </div>
        
        <!-- Formulario agregar canal -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-6 border border-gray-200">
            <h2 class="text-2xl font-semibold mb-4 text-gray-800">➕ Agregar Nuevo Canal</h2>
            <form @submit.prevent="addChannel" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nombre del Canal</label>
                        <input x-model="newChannel.name" 
                               type="text" 
                               placeholder="Ej: Canal Principal" 
                               class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                               required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de Fuente</label>
                        <select x-model="newChannel.source_type" 
                                class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="srt">SRT</option>
                            <option value="rtmp">RTMP</option>
                            <option value="hls">HLS</option>
                            <option value="rtsp">RTSP</option>
                        </select>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">URL RTSP</label>
                        <input x-model="newChannel.rtsp_url" 
                               type="text" 
                               placeholder="rtsp://servidor:554/stream" 
                               class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono text-sm" 
                               required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Dirección UDP</label>
                        <input x-model="newChannel.udp_address" 
                               type="text" 
                               placeholder="239.1.1.1" 
                               class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono" 
                               required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Puerto UDP</label>
                        <input x-model.number="newChannel.udp_port" 
                               type="number" 
                               placeholder="5000" 
                               min="1" 
                               max="65535"
                               class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                               required>
                    </div>
                </div>
                
                <div class="flex justify-end">
                    <button type="submit" 
                            class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors duration-200 font-medium shadow-md hover:shadow-lg">
                        ✓ Agregar Canal
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Lista de canales -->
        <div class="bg-white rounded-xl shadow-lg p-6 border border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold text-gray-800">📋 Canales (<span x-text="channels.length"></span>)</h2>
                <button @click="loadChannels" 
                        class="text-blue-600 hover:text-blue-800 font-medium flex items-center gap-2">
                    🔄 Actualizar
                </button>
            </div>
            
            <!-- Loading state -->
            <div x-show="loading" class="text-center py-8">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                <p class="mt-2 text-gray-600">Cargando canales...</p>
            </div>
            
            <!-- Empty state -->
            <div x-show="!loading && channels.length === 0" class="text-center py-12">
                <div class="text-6xl mb-4">📺</div>
                <p class="text-gray-600 text-lg">No hay canales configurados</p>
                <p class="text-gray-500 text-sm mt-2">Agrega tu primer canal usando el formulario arriba</p>
            </div>
            
            <!-- Channels list -->
            <div x-show="!loading && channels.length > 0" class="space-y-4">
                <template x-for="channel in channels" :key="channel.id">
                    <div class="border border-gray-200 rounded-lg p-5 hover:shadow-md transition-shadow duration-200 bg-gradient-to-r from-white to-gray-50">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <h3 class="font-bold text-lg text-gray-800" x-text="channel.name"></h3>
                                    <span class="text-xs px-3 py-1 rounded-full font-semibold uppercase"
                                          :class="{
                                              'bg-green-100 text-green-800': channel.status === 'running',
                                              'bg-gray-100 text-gray-800': channel.status === 'stopped',
                                              'bg-red-100 text-red-800': channel.status === 'error'
                                          }"
                                          x-text="channel.status">
                                    </span>
                                </div>
                                
                                <div class="space-y-1 text-sm text-gray-600">
                                    <div class="flex items-center gap-2">
                                        <span class="font-semibold">Fuente:</span>
                                        <span class="px-2 py-0.5 bg-blue-100 text-blue-800 rounded text-xs font-medium uppercase" 
                                              x-text="channel.source_type"></span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="font-semibold">RTSP:</span>
                                        <code class="bg-gray-100 px-2 py-0.5 rounded text-xs" x-text="channel.rtsp_url"></code>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="font-semibold">UDP:</span>
                                        <code class="bg-gray-100 px-2 py-0.5 rounded text-xs" 
                                              x-text="channel.udp_address + ':' + channel.udp_port"></code>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex gap-2 ml-4">
                                <button @click="toggleChannel(channel)" 
                                        class="px-4 py-2 rounded-lg font-medium transition-colors duration-200 shadow-sm hover:shadow-md"
                                        :class="channel.status === 'running' 
                                            ? 'bg-yellow-500 hover:bg-yellow-600 text-white' 
                                            : 'bg-green-500 hover:bg-green-600 text-white'"
                                        :disabled="channel.status === 'loading'">
                                    <span x-show="channel.status === 'running'">⏸ Detener</span>
                                    <span x-show="channel.status === 'stopped'">▶ Iniciar</span>
                                    <span x-show="channel.status === 'loading'">⏳</span>
                                </button>
                                
                                <button @click="deleteChannel(channel)" 
                                        class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-colors duration-200 font-medium shadow-sm hover:shadow-md"
                                        :disabled="channel.status === 'running'">
                                    🗑 Eliminar
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center text-gray-500 text-sm">
            <p>MediaMTX Orchestrator v1.0 | Desarrollado con Go + Alpine.js</p>
        </div>
    </div>

    <script>
        function channelManager() {
            return {
                channels: [],
                loading: false,
                notification: {
                    show: false,
                    message: '',
                    type: 'success'
                },
                newChannel: {
                    name: '',
                    source_type: 'srt',
                    rtsp_url: '',
                    udp_address: '239.1.1.1',
                    udp_port: 5000
                },
                
                async init() {
                    await this.loadChannels();
                    // Auto-refresh cada 5 segundos
                    setInterval(() => this.loadChannels(), 5000);
                },
                
                showNotification(message, type = 'success') {
                    this.notification = { show: true, message, type };
                    setTimeout(() => {
                        this.notification.show = false;
                    }, 3000);
                },
                
                async loadChannels() {
                    try {
                        const response = await fetch('/api/v1/channels');
                        const data = await response.json();
                        this.channels = data.channels || [];
                    } catch (error) {
                        console.error('Error cargando canales:', error);
                    }
                },
                
                async addChannel() {
                    try {
                        const channel = {
                            ...this.newChannel,
                            id: Date.now().toString(),
                            status: 'stopped'
                        };
                        
                        const response = await fetch('/api/v1/channels', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(channel)
                        });
                        
                        if (!response.ok) {
                            const error = await response.json();
                            throw new Error(error.error || 'Error creando canal');
                        }
                        
                        this.showNotification('✓ Canal creado exitosamente', 'success');
                        await this.loadChannels();
                        this.resetForm();
                    } catch (error) {
                        this.showNotification('✗ ' + error.message, 'error');
                    }
                },
                
                async toggleChannel(channel) {
                    const action = channel.status === 'running' ? 'stop' : 'start';
                    const originalStatus = channel.status;
                    channel.status = 'loading';
                    
                    try {
                        const response = await fetch(`/api/v1/channels/${channel.id}/${action}`, {
                            method: 'POST'
                        });
                        
                        if (!response.ok) {
                            const error = await response.json();
                            throw new Error(error.error || `Error al ${action === 'start' ? 'iniciar' : 'detener'} canal`);
                        }
                        
                        this.showNotification(
                            action === 'start' ? '✓ Stream iniciado' : '✓ Stream detenido',
                            'success'
                        );
                        await this.loadChannels();
                    } catch (error) {
                        channel.status = originalStatus;
                        this.showNotification('✗ ' + error.message, 'error');
                    }
                },
                
                async deleteChannel(channel) {
                    if (!confirm(`¿Eliminar el canal "${channel.name}"?`)) {
                        return;
                    }
                    
                    try {
                        const response = await fetch(`/api/v1/channels/${channel.id}`, {
                            method: 'DELETE'
                        });
                        
                        if (!response.ok) {
                            const error = await response.json();
                            throw new Error(error.error || 'Error eliminando canal');
                        }
                        
                        this.showNotification('✓ Canal eliminado', 'success');
                        await this.loadChannels();
                    } catch (error) {
                        this.showNotification('✗ ' + error.message, 'error');
                    }
                },
                
                resetForm() {
                    this.newChannel = {
                        name: '',
                        source_type: 'srt',
                        rtsp_url: '',
                        udp_address: '239.1.1.1',
                        udp_port: 5000
                    };
                }
            }
        }
    </script>
</body>
</html>
